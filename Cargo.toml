[package]
name = "seo-audit-core"
version = "0.1.0"
edition = "2021"
description = "SERP pixel-width estimation, robots.txt / sitemap checks and indexability verdicts (CJK-aware). Pure Rust, WASM-friendly."
license = "MIT"
readme = "README.md"
keywords = ["seo", "serp", "robots-txt", "sitemap", "indexability"]
categories = ["web-programming", "text-processing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
